  'Пусть твоя улыбка будет настоящей, а не вежливой. Желаю тебе тех, кто улыбается в ответ. Пусть утро начинается с чего-то, что поднимает настроение. Ведь улыбка заразна, и это лучшая из эпидемий.',
  'Желаю тебе столько поводов для улыбки, чтобы мышцы лица устали. Пусть смешное замечается легко, а грустное проходит быстро. Пусть случайные прохожие иногда улыбаются тебе первыми. Такое бывает, я проверял.',
  'Пусть воспоминания вызывают у тебя тёплую улыбку, а не вздох. Желаю новых историй, которые захочется рассказывать друзьям. Улыбайся себе в зеркале хоть иногда. Ты там вполне симпатичный.',
  'Желаю, чтобы твоя улыбка согревала не только тебя. Пусть ты замечаешь, как она меняет чей-то день. И пусть тебе так же часто дарят улыбки в ответ. Сегодня пусть их будет хотя бы три.',
  'Желаю тебе улыбок, которые появляются сами, без усилий. Пусть их будет больше, чем хмурых минут.',
  'Пусть твоя улыбка заражает окружающих. А чужие улыбки возвращаются к тебе бумерангом.',
  'Желаю тебе поводов улыбаться даже в обычный день. Случайная песня, смешная мысль, тёплое сообщение.',
  'Пусть улыбка в зеркале нравится тебе самому. Ты выглядишь лучше, когда она настоящая.',
  'Желаю, чтобы сегодня ты улыбнулся хотя бы три раза — просто так. Мир от этого станет чуть светлее.'
 ],
 secretWish:'Тайное: улыбка есть даже у гусей, просто она спрятана в клюве. Видишь, как я щурюсь? Это она. Желаю, чтобы твоя всегда была на виду.'
};

  'Желаю дней, когда хочется сказать жизни «спасибо» без особой причины. Таких дней пусть будет много.',
  'Пусть счастье не прячется за горизонтом. Иногда оно сидит рядом и пьёт с тобой чай. Замечай его.',
  'Желаю тебе тихого и шумного счастья в нужных пропорциях. И людей, с которыми им можно делиться.'

};

  'Пусть ты умеешь доверять себе. Твои решения чаще верны, чем кажется. Прислушивайся.',

function sanitizeNick(s){
 s=(s||'').replace(/[<>\"&]/g,'').replace(/\s+/g,' ').trim().slice(0,16);
 return s;
}
function nick(){return D.nick||''}
// Подставляет {n} на ник. Если {n} нет — изредка (chance) добавляет обращение в начало.
function V(arr,key,chance){
 if(chance==null)chance=.2;
 let t=Array.isArray(arr)?pk(arr,key):String(arr||'');
 const n=nick();
 if(n&&t.indexOf('{n}')>=0)return t.split('{n}').join(n);
 t=t.replace(/\{n\}/g,'').replace(/\s{2,}/g,' ').trim();
 if(n&&Math.random()<chance){
  const forms=[
   n+'. '+t,
   n+', '+t.charAt(0).toLowerCase()+t.slice(1),
   t.replace(/ГА!?\.?\s*$/,'ГА, '+n+'!')
  ];
  t=forms[Math.random()*forms.length|0];
 }
 return t;
}

const KEY='valera_v1';
let D=load();
function load(){
 let d=null;
 try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!d||typeof d!=='object'||Array.isArray(d))d={};
 d.visits=Math.max(0,+d.visits||0);d.done=Math.max(0,+d.done||0);
 d.grand=!!d.grand;d.snd=d.snd!==false;d.ach=Array.isArray(d.ach)?d.ach.filter(x=>typeof x==='string'):[];
 // ник игрока — Валера иногда обращается по имени
 d.nick=typeof d.nick==='string'?d.nick.replace(/[<>"&]/g,'').trim().slice(0,16):'';
 d.realm=d.realm===2?2:1; // 1 — родная галактика, 2 — космический мир
 if(!d.words||typeof d.words!=='object')d.words={};
 if(!d.words2||typeof d.words2!=='object')d.words2={};
 const ints=a=>Array.isArray(a)?a.filter(Number.isInteger):[];
 const loadWordBag=(bag,lib)=>{
  WORDS.forEach(w=>{
   const s=(bag[w.id]&&typeof bag[w.id]==='object')?bag[w.id]:{};
   const found=ints(s.found);
   const maxW=(lib[w.id]&&lib[w.id].wishes)?lib[w.id].wishes.length:(w.wishes?w.wishes.length:5);
   let unlocked=Math.max(5,+s.unlocked||0);
   if(found.length)unlocked=Math.max(unlocked,Math.max.apply(null,found)+1);
   unlocked=Math.min(maxW,Math.max(5,unlocked));
   bag[w.id]={opens:Math.max(0,+s.opens||0),seen:ints(s.seen),found,done:Math.max(0,+s.done||0),last:typeof s.last==='string'?s.last:null,secret:!!s.secret,unlocked};
  });
 };
 // STORY/STORY2 могут ещё не быть видны при первом парсе — после загрузки вызовем fixUnlocks
 loadWordBag(d.words,{});
 loadWordBag(d.words2,{});
 const nn=(x,def,hi)=>{x=+x;return Number.isFinite(x)?Math.min(hi||1e9,Math.max(0,x)):def};
 d.items=Array.isArray(d.items)?d.items.filter((x,i,r)=>ITEMS.some(t=>t.id===x)&&r.indexOf(x)===i):[];
 const p=d.pet&&typeof d.pet==='object'?d.pet:{},eq={};

 d.pet={mood:nn(p.mood,70,100),food:nn(p.food,60,100),energy:nn(p.energy,80,100),fed:nn(p.fed,0),gifts:nn(p.gifts,0),games:nn(p.games,0),taps:nn(p.taps,0),t:+p.t>0?+p.t:Date.now(),equip:eq};
 const e=d.econ&&typeof d.econ==='object'?d.econ:{};
 d.econ={cookies:nn(e.cookies,3),earned:nn(e.earned,0),spent:nn(e.spent,0),log:Array.isArray(e.log)?e.log.slice(-200):[],claimed:Array.isArray(e.claimed)?e.claimed.filter(x=>typeof x==='string').slice(-400):[]};
 d.log=Array.isArray(d.log)?d.log.slice(-300):[];
 d.vw=Array.isArray(d.vw)?d.vw.filter((x,i,r)=>Number.isInteger(x)&&x>=0&&x<5&&r.indexOf(x)===i):[];
 d.achDate=d.achDate&&typeof d.achDate==='object'&&!Array.isArray(d.achDate)?d.achDate:{};
 d.games=d.games&&typeof d.games==='object'?d.games:{};
 const mu=d.music&&typeof d.music==='object'?d.music:{};
 d.music={on:!!mu.on,track:typeof mu.track==='string'?mu.track:'organ',vol:typeof mu.vol==='number'&&isFinite(mu.vol)?Math.min(1,Math.max(0,mu.vol)):.5};

// Таймер идёт по реальному времени (даже когда игра закрыта).

function ensurePromo(){

 // уже есть незабранный конверт

 P.code=code;P.reward=rollPromoReward();P.created=now;P.nextAt=0;save();

}

 if(P.claimed.includes(code))return {ok:false,why:'used'};
 if(!P.code||P.code!==code)return {ok:false,why:'unknown'};
 const reward=P.reward||rollPromoReward();
 const now=Date.now();
 P.claimed.push(code);if(P.claimed.length>100)P.claimed.shift();
 P.code=null;P.reward=0;P.created=0;
 P.nextAt=now+PROMO_HOURS*3.6e6; // следующий только через 12 часов

  const t=AC.currentTime,tone=(f,d,ty,v,f2,dl)=>{const o=AC.createOscillator(),g=AC.createGain(),t0=t+(dl||0);o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)};
  if(k==='tap')tone(520,.15,'sine',.1,880);
  else if(k==='key'){tone(784,.3,'triangle',.1);tone(1175,.4,'triangle',.08,0,.12)}
  else if(k==='chomp'){for(let i=0;i<4;i++)tone(220,.12,'square',.06,110,i*.35)}
  else if(k==='honk'){tone(420,.35,'sawtooth',.07,220)}
  else if(k==='pop'){tone(600,.1,'sine',.12,1200)}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.1,0,i*.12))}
  else if(k==='boom'){const n=AC.sampleRate*.6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const sr=AC.createBufferSource(),g=AC.createGain();sr.buffer=b;g.gain.value=.25;sr.connect(g);g.connect(AC.destination);sr.start(t);tone(140,.4,'sine',.2,40)}
 }catch(e){}
}

/* ============ СЮЖЕТ ============ */
let busy=false;
async function openWord(w){
 if(busy||panelOpen())return;
 if(!w.wishes||!w.wishes.length){toast('Валера: «Эту историю я ещё дописываю. Загляни попозже. ГА!»');return}
 busy=true;$('#gal').classList.add('busy');snd('tap');
 try{await story(w)}
 catch(e){console.error(e);$('#sc').classList.remove('on');save()}
 finally{busy=false;$('#gal').classList.remove('busy')}
}
async function story(w){
 const s=wordState(w.id),W=innerWidth,H=innerHeight,sc=$('#sc'),st=$('#st'),fx=$('#fx'),dk=$('#dark');
 D.visits++;s.opens++;s.last=new Date().toISOString();save();logEv('visit','Заглянули к слову «'+w.name+'»');
 st.innerHTML='';fx.innerHTML='';dk.style.opacity=0;
 sc.style.background=`radial-gradient(circle at 50% 40%,${w.bg[0]},${w.bg[1]})`;
 sc.classList.add('on');

 // skip → сразу к письму
 let skipped=false,wake=null;
 const pause=ms=>new Promise(r=>{
  if(skipped)return r();
  const t=setTimeout(r,ms);
  wake=()=>{clearTimeout(t);r()};
 });
 const doSkip=()=>{skipped=true;if(wake)wake()};
 const skBtn=document.createElement('button');
 skBtn.className='skipbtn';skBtn.textContent='Пропустить ▶';
 skBtn.onclick=e=>{e.stopPropagation();doSkip()};
 sc.appendChild(skBtn);

 await pause(300);

 // ========== 1. Слово + бабочки несут ключ ==========
 let keyEl=null,keyX=W/2,keyY=H*.42;
 if(!skipped){
  const bw=document.createElement('div');bw.className='bw';bw.textContent=w.name;bw.style.color=w.col;bw.style.setProperty('--c',w.col);st.appendChild(bw);
  const cx=W/2,cy=H*.36;
  for(let i=0;i<Math.min(10,w.hs.n);i++)puff(fx,cx+rnd(-50,50),cy+rnd(-15,15),pick(w.hearts),'',{dist:Math.min(W,H)*.4*w.hs.d,dur:1500,size:rnd(12,28)});
  const n=Math.max(8,(w.bf.n||4)+6);
  let leadP=null,leadB=null,to0=null;
  for(let i=0;i<n;i++){
   if(skipped)break;
   const b=document.createElement('div');b.className='bf';b.style.setProperty('--h',(w.bf.hue||200)+'deg');
   b.innerHTML='<span>🦋</span>'+(i?'':'<div class="kk">🗝️</div>');
   b.style.fontSize=(i?rnd(20,34):42)+'px';fx.appendChild(b);
   const from=[i%2?-80:W+80,H*rnd(.4,.95)],to=[cx+(i?rnd(-120,120):0),cy+(i?rnd(-50,50):55)];
   const a=b.animate(path(from,to,(w.bf.amp||50)*rnd(.6,1.1),(w.bf.freq||1.5),14),{duration:2000*(i?rnd(.85,1.15):1),delay:i*70,easing:'ease-in-out',fill:'both'});
   if(!i){leadP=a.finished;leadB=b;to0=to}
   else a.finished.then(()=>{try{b.animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'})}catch(e){}});
  }
  if(leadP&&!skipped)await Promise.race([leadP,pause(2400)]);
  if(!skipped&&to0){
   keyX=to0[0];keyY=to0[1]+40;
   keyEl=document.createElement('div');keyEl.className='key';keyEl.textContent='🗝️';
   keyEl.style.left=keyX+'px';keyEl.style.top=keyY+'px';st.appendChild(keyEl);
   try{leadB&&leadB.querySelector('.kk')?.remove()}catch(e){}
   snd('key');
   for(let i=0;i<8;i++)puff(fx,keyX,keyY,'✨','',{dist:70,dur:900,size:rnd(12,22)});
   fx.querySelectorAll('.bf').forEach(b=>{try{b.animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'})}catch(e){}});
   await pause(400);
  }
 }

 // ========== 2. Валера + интерактив: отдай ключик ==========
 if(!skipped){
  dk.style.opacity=.4;
  try{st.querySelector('.bw')?.remove()}catch(e){}
  const g=document.createElement('div');g.id='goose';g.innerHTML='<div class="bub" id="bub"></div>'+gooseSVG(null,true);st.appendChild(g);
  g.animate([{transform:'translateX(110vw)'},{transform:'none'}],{duration:650,easing:'ease-out'});
  await pause(700);
  if(!skipped){
   say(V(['Меняю ключик на конвертик! Дай-ка его сюда.','{n}, ключик мне — тебе письмецо. Тащи сюда!','Честная сделка: ключ на конверт. ГА!'],'ex',.4));
   snd('honk');
   const cap=document.createElement('div');cap.className='cap';cap.textContent='Нажми на ключик или перетащи его к Валере';st.appendChild(cap);

   // 1 из 5 — вредничает
   const naughty=Math.random()<0.2;
   let accepted=false;

   const acceptKey=async()=>{
    if(accepted||skipped)return;accepted=true;
    cap.remove();
    say(V(['Оп, ключик мой! Держи конвертик.','Договорились! Письмецо твоё.','ГА! Честный обмен.'],'acc',.35));
    snd('key');
    if(keyEl){
     const gr=g.getBoundingClientRect();
     const kr=keyEl.getBoundingClientRect();
     const dx=(gr.left+gr.width*.55)-(kr.left+kr.width/2);
     const dy=(gr.top+gr.height*.35)-(kr.top+kr.height/2);
     await keyEl.animate([{transform:'translate(-50%,-50%)'},{transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.4)`,opacity:.3}],{duration:450,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{});
     try{keyEl.remove()}catch(e){}
    }
   };

   // побег Валеры
   const runAway=()=>new Promise(async res=>{
    say(V(['Не-е-ет! Не отдам… то есть не возьму! Поймайте гуся!','ГА-ГА! Догони, если сможешь!','{n}, ключик мой… стоп, наоборот! Бегу!'],'run',.5));
    snd('honk');
    // метается влево-вправо
    for(let i=0;i<4&&!skipped;i++){
     const side=i%2?-1:1;
     await g.animate([{transform:'translateX(0)'},{transform:`translateX(${side*18}vw) rotate(${side*8}deg)`},{transform:'translateX(0)'}],{duration:380,easing:'ease-in-out'}).finished.catch(()=>{});
    }
    if(skipped)return res();
    // запыхался, шлёпается на попу
    say(V(['Фух… всё, сдаюсь. Ключик… давай.','Уфф. Лапы отваливаются. Ладно, забирай… то есть отдавай.','Шлёп. Сижу. Принимаю ключик. ГА…'],'sit',.5));
    g.animate([{transform:'translateY(0)'},{transform:'translateY(12px) scale(1.05,.9)'},{transform:'translateY(6px) scale(1.02,.96)'}],{duration:500,fill:'forwards'});
    await pause(900);
    res();
   });

   // интерактив ключа: тап или drag к гусю
   await new Promise(res=>{
    if(skipped||!keyEl){res();return}
    let on=false,sx=0,sy=0,ox=0,oy=0,moved=0,busyRun=false;

    const tryGive=async()=>{
     if(accepted||skipped||busyRun)return;
     if(naughty&&!g._tired){
      busyRun=true;g._tired=true;
      keyEl.style.pointerEvents='none';
      await runAway();
      keyEl.style.pointerEvents='';
      busyRun=false;
      if(skipped){res();return}
      // после побега — принимаем при следующей попытке
      return;
     }
     keyEl.onpointerdown=keyEl.onpointermove=keyEl.onpointerup=null;
     await acceptKey();
     res();
    };

    keyEl.style.cursor='pointer';
    keyEl.style.touchAction='none';
    keyEl.onpointerdown=e=>{
     if(accepted||skipped||busyRun)return;
     on=true;moved=0;sx=e.clientX;sy=e.clientY;
     const r=keyEl.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;
     try{keyEl.setPointerCapture(e.pointerId)}catch(_){}
    };
    // ключик не заезжает под пузырь реплики — отталкивается с зазором ~2мм
    const pushFromBub=(x,y)=>{
     const b=document.querySelector('#goose .bub')||document.getElementById('bub');
     if(!b||!b.classList.contains('pop')&&!b.textContent)return {x,y};
     const r=b.getBoundingClientRect();
     if(r.width<4||r.height<4)return {x,y};
     const pad=10; // ~2мм + чуть запаса на палец
     const L=r.left-pad,R=r.right+pad,T=r.top-pad,B=r.bottom+pad;
     if(x>L&&x<R&&y>T&&y<B){
      const dl=x-L,dr=R-x,dt=y-T,db=B-y,m=Math.min(dl,dr,dt,db);
      if(m===dl)x=L;else if(m===dr)x=R;else if(m===dt)y=T;else y=B;
     }
     return {x,y};
    };
    keyEl.onpointermove=e=>{
     if(!on||accepted)return;
     const dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(moved,Math.hypot(dx,dy));
     let nx=ox+dx,ny=oy+dy;
     const p=pushFromBub(nx,ny);nx=p.x;ny=p.y;
     keyEl.style.left=nx+'px';keyEl.style.top=ny+'px';
     keyEl.style.transform='translate(-50%,-50%)';
    };
    keyEl.onpointerup=e=>{
     if(!on)return;on=false;
     // тап или поднесли к Валере
     const gr=g.getBoundingClientRect(),kr=keyEl.getBoundingClientRect();
     const near=Math.hypot(kr.left+kr.width/2-(gr.left+gr.width/2),kr.top+kr.height/2-(gr.top+gr.height*.4))<130;
     if(moved<12||near)tryGive();
     else{
      // вернуть на место слегка
      keyEl.animate([{left:keyEl.style.left,top:keyEl.style.top},{left:keyX+'px',top:keyY+'px'}],{duration:280,fill:'forwards'});
      keyEl.style.left=keyX+'px';keyEl.style.top=keyY+'px';
     }
    };

    // если скип во время ожидания
    const poll=setInterval(()=>{if(skipped){clearInterval(poll);res()}},120);
   });
  }
 }

 // ========== 3. Конверт в центре → бомба падает → БАХ → открытие ==========
 if(!skipped){
  // убрать гуся и подписи
  try{st.querySelector('#goose')?.remove()}catch(e){}
  try{st.querySelector('.cap')?.remove()}catch(e){}
  try{st.querySelector('.key')?.remove()}catch(e){}
  fx.innerHTML='';
  dk.style.opacity=.55;

  const env=document.createElement('div');env.className='env';env.textContent='💌';st.appendChild(env);
  env.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:400});
  say(V(['Вот твоё письмецо… Ой.','Что это сверху?','{n}, пригнись!'],'env',.35));
  await pause(500);
  if(!skipped){
   // бомба падает на конверт
   const bwr=document.createElement('div');bwr.id='bwrap';bwr.innerHTML=BOMB;st.appendChild(bwr);
   bwr.style.zIndex=5;
   bwr.animate([{transform:'translateY(-70vh) rotate(-15deg)'},{transform:'translateY(0) rotate(0)'}],{duration:650,easing:'cubic-bezier(.25,.8,.3,1)',fill:'forwards'});
   await pause(650);
  }
  if(!skipped){
   const bomb=$('#bomb');
   if(bomb)bomb.classList.add('shake');
   await pause(280);
   const br=(st.querySelector('#bwrap')||env).getBoundingClientRect();
   const bx=br.left+br.width/2,by=br.top+br.height/2;
   try{st.querySelector('#bwrap')?.remove()}catch(e){}
   // БАХ
   const fl=document.createElement('div');fl.className='flash';fl.style.left=(bx-80)+'px';fl.style.top=(by-80)+'px';fx.appendChild(fl);
   fl.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(4.5)',opacity:0}],{duration:480,easing:'ease-out'}).onfinish=()=>fl.remove();
   snd('win');
   for(let i=0;i<Math.min(36,w.burst.n||36);i++){
    const glyph=Math.random()<.35;
    puff(fx,bx,by,glyph?pick(['♥','❤']):pick(w.burst.em||w.hearts),glyph?pick(w.pal||['#fff']):'',{dist:Math.max(W,H)*rnd(.3,.65),dur:1200,size:rnd(14,38),grav:w.burst.g||20});
   }
   // конверт «открывается»
   if(env){
    env.animate([
     {transform:'translate(-50%,-50%) scale(1) rotate(0)'},{transform:'translate(-50%,-50%) scale(1.25) rotate(-6deg)'},{transform:'translate(-50%,-50%) scale(1.1) rotate(0)',opacity:.9}
    ],{duration:500});
    env.textContent='📨';
   }
   await pause(700);
  }
 }

 // ========== ПИСЬМО ==========
 st.innerHTML='';fx.innerHTML='';dk.style.opacity=.65;
 try{skBtn.remove()}catch(e){}

 const idx=chooseWish(w,s);s.seen.push(idx);if(!s.found.includes(idx))s.found.push(idx);
 const pending=s.found.filter(i=>i<5).length>=5&&!s.secret;
 save();

 const card=(t,x)=>{const c=document.createElement('div');c.className='card';c.style.setProperty('--c',w.col);const h=document.createElement('h3'),p=document.createElement('p');h.textContent=t;p.textContent=x;c.append(h,p);st.appendChild(c);return c};
 let c=card(w.name,w.wishes[idx]);
 snd('key');
 await btn(pending?'Дальше':'Принять письмо',w.col);

 if(pending){
  c.remove();
  say(V(L.secret,'sc',.4));
  await sleep(1400);
  c=card('Тайное пожелание · '+w.name,w.secretWish);
  await btn('Принять письмо',w.col);
 }
 c.remove();

 s.done++;D.done++;if(pending)s.secret=true;save();refreshMarks();D.pet.mood=Math.min(100,D.pet.mood+3);logEv('story','Завершена история «'+w.name+'»');if(earn('story:'+w.id+':'+s.done,1,'История «'+w.name+'»'))toast('🍪 +1 печенька от Валеры');checkAch();checkGifts();

 if(agg().complete>=15&&!D.grand){
  D.grand=true;save();snd('key');
  const gc=el('div','card'),gh=el('h3','','👑 Финальный подарок'),gp=el('p','','Ты прошёл всю галактику и собрал все пожелания до последнего. Валера официально записывает тебя в друзья галактики. Дверь в мой дневник всегда открыта, а печенька всегда твоя. ГА!');
  gc.style.setProperty('--c',w.col);gc.append(gh,gp);st.appendChild(gc);
  await btn('Дальше',w.col);gc.remove();
 }

 await btn('Вернуться назад',w.col);
 sc.classList.remove('on');await sleep(700);
 st.innerHTML='';fx.innerHTML='';dk.style.opacity=0;
}

// earn: key — уникальный id награды, повторно она не начисляется (даже после обновления страницы)
function earn(key,n,why){
 const E=D.econ;if(!(n>0)||(key&&E.claimed.includes(key)))return false;
 E.cookies+=n;E.earned+=n;if(key){E.claimed.push(key);if(E.claimed.length>400)E.claimed.shift()}
 E.log.push({t:Date.now(),d:n,w:why});if(E.log.length>200)E.log.shift();save();return true;
}
function spend(n,why){
 const E=D.econ;if(!(n>0)||E.cookies<n)return false;
 E.cookies-=n;E.spent+=n;E.log.push({t:Date.now(),d:-n,w:why});if(E.log.length>200)E.log.shift();save();return true;
}
function logEv(y,w){D.log.push({t:Date.now(),y,w});if(D.log.length>300)D.log.shift();save()}

 p.t=now;save();
}

  const sx=b0.left+b0.width/2,sy=b0.top,ex=bk.left+bk.width/2,ey=bk.top+bk.height/2;
  await c.animate([{transform:`translate(${sx}px,${sy}px) scale(1)`},{transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-60}px) scale(1.2)`,offset:.5},{transform:`translate(${ex}px,${ey}px) scale(.3)`}],{duration:700,easing:'ease-in-out',fill:'forwards'}).finished;

 }finally{feeding=false}

   const h=pick(free),g=Math.random()<.14,w=el('div','worm'+(g?' gold':''),'🪱');h.w=1;active++;h.appendChild(w);
   // комочки земли при появлении
   for(let i=0;i<3;i++){const d=el('div','dirt',pick(['·','•','˙']));d.style.left=(h.getBoundingClientRect().left+h.offsetWidth/2+rnd(-20,20))+'px';d.style.top=(h.getBoundingClientRect().top+10)+'px';d.style.position='fixed';$('#gm').appendChild(d);setTimeout(()=>d.remove(),700)}
   // сам уползает, если не поймали
   const hide=setTimeout(()=>{if(h.w&&w.parentNode){h.w=0;active--;w.style.transition='transform .35s,opacity .35s';w.style.transform='translateY(110%)';w.style.opacity='0';setTimeout(()=>w.remove(),360)}},rnd(1600,2800));

  const [nx,ny,b,o]=pick(nb);w[y][x]&=~b;w[ny][nx]&=~o;vis[ny][nx]=1;st.push([nx,ny]);

}

// ---- Покупка разблокирует новые варианты для галактики (не добавляет в «прочитанные») ----
function buyWishes(id,qty){
 const w=WORDS.find(x=>x.id===id);if(!w||!w.wishes)return {ok:false,why:'unknown'};
 const s=wordState(id);
 const total=w.wishes.length;
 let unlocked=Math.min(total,Math.max(5,+s.unlocked||5));
 const left=total-unlocked;
 if(left<=0)return {ok:false,why:'full'};
 qty=Math.max(1,Math.min(+qty||1,left,10));
 const cost=qty*CARD_PRICE;
 if(D.econ.cookies<cost)return {ok:false,why:'poor',cost};
 if(shopBusy)return {ok:false,why:'busy'};
 shopBusy=true;
 try{
  if(!spend(cost,'Лавка: новые варианты «'+w.name+'» ×'+qty))return {ok:false,why:'poor'};
  s.unlocked=unlocked+qty;
  // found/seen НЕ трогаем — новые тексты появятся только при следующем открытии слова в галактике
  D.shop.buys++;
  shopHist('Новые варианты «'+w.name+'» ×'+qty,cost);
  logEv('shop','Разблокировано вариантов «'+w.name+'»: +'+qty+' (теперь '+s.unlocked+')');
  save();
  return {ok:true,cost,name:w.name,qty,unlocked:s.unlocked};
 }finally{setTimeout(()=>{shopBusy=false},500)}
}

const PADS={organ:{h:[1,.5,.33,.2],w:'sine',a:.3,r:.7},flute:{h:[1,.15],w:'sine',a:.12,r:.4,vib:5.2,vd:10},violin:{h:[1],w:'sawtooth',a:.18,r:.5,lp:2200,vib:5.5,vd:14},cello:{h:[1],w:'sawtooth',a:.25,r:.7,lp:900,vib:4.5,vd:10}};

function mg(){const c=ctx();if(!MG){MG=c.createGain();MG.gain.value=D.music.vol*.5;MG.connect(c.destination)}return MG}
function voice(c,out,type,f,t,d,vol){
 const P=PADS[type],env=c.createGain(),mix=c.createGain();let last=mix;
 if(P.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=P.lp;mix.connect(fl);last=fl}
 last.connect(env);env.connect(out);
 env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vol,t+P.a);env.gain.setValueAtTime(vol,Math.max(t+P.a,t+d-.05));env.gain.linearRampToValueAtTime(0,t+d+P.r);
 P.h.forEach((a,i)=>{
  const o=c.createOscillator(),og=c.createGain();o.type=P.w;o.frequency.value=f*(i+1);og.gain.value=a;o.connect(og);og.connect(mix);
  if(P.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=P.vib;lg.gain.value=P.vd;l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+d+P.r+.1)}
  o.start(t);o.stop(t+d+P.r+.1);
 });
}
function playLoop(tr,id){
 const c=ctx(),beat=60/tr.bpm,t0=Math.max(c.currentTime+.15,MUS.next||0);
 tr.m.forEach(e=>{if(e.n!=null)voice(c,MUS.tg,tr.inst,hz(e.n),t0+e.t*beat,e.d*beat*.98,tr.mv)});
 tr.c.forEach(e=>voice(c,MUS.tg,'organ',hz(e.n),t0+e.t*beat,e.d*beat,tr.cv));
 MUS.next=t0+16*beat;
 MUS.timer=setTimeout(()=>{if(MUS.cur===id)playLoop(tr,id)},Math.max(300,(MUS.next-c.currentTime-1)*1000));
}
function fadeAudio(a,to,done){const from=a.volume;let i=0;const iv=setInterval(()=>{i++;a.volume=Math.max(0,Math.min(1,from+(to-from)*i/20));if(i>=20){clearInterval(iv);if(done)done()}},40)}

function musicStop(){
 clearTimeout(MUS.timer);MUS.cur=null;
 if(MUS.tg){const nodes=MUS.nodes,tg=MUS.tg;try{tg.gain.setTargetAtTime(0,AC.currentTime,.25)}catch(e){}setTimeout(()=>nodes.forEach(n=>{try{n.disconnect()}catch(e){}}),3000);MUS.tg=null;MUS.nodes=[]}
 if(MUS.audio){const a=MUS.audio;MUS.audio=null;fadeAudio(a,0,()=>a.pause())}
}
function musicStart(id){
 musicStop();const f=MUSIC_FILES.find(x=>x.id===id),tr=TRACKS[id];
 if(!f&&!tr){id='organ';D.music.track=id}
 MUS.cur=id;
 if(f){const a=new Audio(f.src);a.loop=true;a.volume=0;a.play().catch(()=>{});MUS.audio=a;fadeAudio(a,D.music.vol);return}
 const c=ctx(),tg=c.createGain(),dl=c.createDelay(1),fb=c.createGain(),wet=c.createGain();
 tg.gain.value=0;dl.delayTime.value=.38;fb.gain.value=.35;wet.gain.value=.3;
 tg.connect(mg());tg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(mg());
 tg.gain.setTargetAtTime(1,c.currentTime,.5);MUS.tg=tg;MUS.nodes=[tg,dl,fb,wet];MUS.next=0;playLoop(TRACKS[id],id);
}

function hmPicker(init,reset,onCh){
